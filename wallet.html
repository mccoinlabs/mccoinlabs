<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCCOIN Wallet</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/11.0.0/stellar-sdk.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:20px}
.card{background:#1a1a1a;border:1px solid #FFD700;border-radius:16px;padding:20px;max-width:420px;margin:auto}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#222;color:#fff;box-sizing:border-box}
button{background:#FFD700;color:#000;border:0;padding:12px;border-radius:10px;width:100%;font-weight:bold;margin:6px 0;cursor:pointer}
button.sec{background:#222;color:#fff;border:1px solid #FFD700}
.box{background:#222;padding:12px;border-radius:10px;text-align:left;word-break:break-all;margin:10px 0}
.small{font-size:12px;color:#aaa;line-height:1.5}
.hidden{display:none}
label{font-size:13px;color:#FFD700;display:block;text-align:left;margin-top:10px}
</style>
</head>
<body>

<img src="logo.png" width="90" style="border-radius:50%;border:2px solid gold">
<h2>MCCOIN • Wallet</h2>

<!-- TELA LOGIN / CRIAR -->
<div id="tela-login" class="card">
  <h3>Entrar na Carteira</h3>

  <label>1. Crie sua senha (você inventa!)</label>
  <input id="senha" type="password" placeholder="Ex: 1234 ou mccoin123">
  <label>2. Repita sua senha</label>
  <input id="senha2" type="password" placeholder="Digite a mesma senha de novo">

  <button onclick="criarCarteira()">Criar Minha Carteira</button>
  <button class="sec" onclick="entrar()">Já tenho carteira - Entrar</button>
  <button class="sec" onclick="mostrarImportar()">Importar com SEC / Restaurar</button>

  <div id="box-importar" class="hidden">
    <input id="sec-importar" placeholder="Cole seu SEC aqui (começa com S...)">
    <input id="senha-nova" type="password" placeholder="Crie uma senha nova">
    <button onclick="importar()">Restaurar Carteira</button>
  </div>

  <p class="small">Como funciona:<br>
  • 1ª vez: Você cria uma senha e clica em <b>Criar Minha Carteira</b><br>
  • O site gera sua PUB e SEC na hora<br>
  • Salve seu SEC com o botão <b>Salvar Backup</b><br>
  • Depois é só digitar sua senha para entrar</p>
</div>

<!-- TELA CARTEIRA -->
<div id="tela-carteira" class="card hidden">
  <h3>Olá, Usuário</h3>

  <div class="box">
    <b>PUB:</b><br><span id="pub-txt">-</span><br>
    <button onclick="copiar('pub-txt')">📋 Copiar PUB</button>
    <button class="sec" onclick="salvarTxt()">💾 Salvar Backup (.txt)</button>
  </div>

  <div class="box">
    <b>SEC:</b><br><span id="sec-txt">••••••••••••••••</span><br>
    <button onclick="mostrarSec()">👁️ Mostrar / Esconder</button>
    <button onclick="copiarSec()">📋 Copiar SEC</button>
  </div>

  <button onclick="gerarPar()">🔑 Gerar Par Novo</button>
  <button onclick="criarTrustline()">🪙 Criar Trustline MCCOIN</button>
  <button class="sec" onclick="sair()">Sair</button>
  <p class="small" id="status"></p>
</div>

<script>
let secAtual = "";
let secVisivel = false;

function copiar(id){
  let t = document.getElementById(id).innerText;
  navigator.clipboard.writeText(t);
  alert("Copiado!");
}
function copiarSec(){
  if(!secAtual) return alert("Gere uma carteira primeiro");
  navigator.clipboard.writeText(secAtual);
  alert("SEC copiado! Guarde com cuidado!");
}
function mostrarSec(){
  if(!secAtual) return;
  secVisivel = !secVisivel;
  document.getElementById("sec-txt").innerText = secVisivel ? secAtual : "••••••••••••••••";
}
function salvarTxt(){
  if(!secAtual) return alert("Gere uma carteira primeiro");
  let pub = document.getElementById("pub-txt").innerText;
  let conteudo = "MCCOIN WALLET BACKUP\n\nPUB: "+pub+"\nSEC: "+secAtual+"\n\nGUARDE COM SEGURANÇA. NUNCA COMPARTILHE SEU SEC!";
  let blob = new Blob([conteudo], {type:"text/plain"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "mccoin-backup.txt";
  a.click();
}
function criarCarteira(){
  let senha = document.getElementById("senha").value;
  let senha2 = document.getElementById("senha2").value;
  if(senha.length < 4) return alert("Crie uma senha com no mínimo 4 dígitos! Ex: 1234");
  if(senha !== senha2) return alert("As senhas não são iguais! Digite a mesma nos 2 campos.");
  let par = StellarSdk.Keypair.random();
  secAtual = par.secret();
  let pub = par.publicKey();
  let cripto = CryptoJS.AES.encrypt(secAtual, senha).toString();
  localStorage.setItem("mccoin_wallet", JSON.stringify({pub:pub, sec_cripto:cripto}));
  abrirCarteira(pub);
  alert("Carteira criada! COPIE e SALVE seu SEC agora!");
}
function entrar(){
  let senha = document.getElementById("senha").value;
  let salvo = localStorage.getItem("mccoin_wallet");
  if(!salvo) return alert("Nenhuma carteira neste aparelho. Crie uma senha e clique em Criar Minha Carteira.");
  try{
    let dados = JSON.parse(salvo);
    let sec = CryptoJS.AES.decrypt(dados.sec_cripto, senha).toString(CryptoJS.enc.Utf8);
    if(!sec) return alert("Senha errada!");
    secAtual = sec;
    abrirCarteira(dados.pub);
  }catch(e){ alert("Senha errada!"); }
}
function mostrarImportar(){ document.getElementById("box-importar").classList.remove("hidden"); }
function importar(){
  let sec = document.getElementById("sec-importar").value.trim();
  let senha = document.getElementById("senha-nova").value;
  if(!sec.startsWith("S")) return alert("SEC inválido! Começa com S...");
  if(senha.length < 4) return alert("Crie uma senha!");
  try{
    let par = StellarSdk.Keypair.fromSecret(sec);
    let cripto = CryptoJS.AES.encrypt(sec, senha).toString();
    localStorage.setItem("mccoin_wallet", JSON.stringify({pub:par.publicKey(), sec_cripto:cripto}));
    secAtual = sec;
    abrirCarteira(par.publicKey());
    alert("Carteira restaurada com sucesso!");
  }catch(e){ alert("SEC inválido!"); }
}
function abrirCarteira(pub){
  document.getElementById("tela-login").classList.add("hidden");
  document.getElementById("tela-carteira").classList.remove("hidden");
  document.getElementById("pub-txt").innerText = pub;
  document.getElementById("sec-txt").innerText = "••••••••••••••••";
  secVisivel = false;
}
function gerarPar(){
  if(!confirm("Gerar um par novo vai substituir a carteira atual. Você já salvou seu SEC?")) return;
  let par = StellarSdk.Keypair.random();
  secAtual = par.secret();
  let senha = prompt("Digite sua senha para salvar o novo par:");
  if(!senha) return;
  let cripto = CryptoJS.AES.encrypt(secAtual, senha).toString();
  localStorage.setItem("mccoin_wallet", JSON.stringify({pub:par.publicKey(), sec_cripto:cripto}));
  abrirCarteira(par.publicKey());
  alert("Novo par gerado! Salve seu novo SEC!");
}
async function criarTrustline(){
  document.getElementById("status").innerText = "Criando Trustline MCCOIN... (precisa de 1 XLM na conta para ativar)";
  alert("Trustline: Para ativar, sua conta precisa ter 1 XLM.");
}
function sair(){
  secAtual = "";
  document.getElementById("tela-carteira").classList.add("hidden");
  document.getElementById("tela-login").classList.remove("hidden");
}
</script>
</body>
</html>
