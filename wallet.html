<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCCOIN</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0;padding:15px}
h1{color:#d4af37;font-size:42px;text-shadow:0 0 20px #d4af37;margin:10px}
h2{color:#d4af37;letter-spacing:3px}
img{width:180px;border-radius:50%;border:3px solid #d4af37}
.card{border:1px solid #d4af37;border-radius:12px;padding:12px;margin:12px 0;text-align:left;background:#0a0a0a}
input{width:100%;padding:12px;border:1px solid #d4af37;border-radius:8px;background:#000;color:#fff;margin:6px 0}
button{width:100%;padding:13px;border:none;border-radius:8px;background:#d4af37;color:#000;font-weight:900;margin-top:8px}
button.b{background:#111;color:#d4af37;border:1px solid #d4af37}
label{color:#d4af37;font-weight:700;font-size:13px}
.small{font-size:12px;color:#ccc}
</style>
</head>
<body>

<h1>MCCOIN</h1>
<img src="logo.png">
<h2>MY WALLET</h2>

<div class="card">
<label>Passo 1 - Entrar com Chave Pública</label>
<input id="pub" placeholder="PUB G...">
<button onclick="entrar()">ENTRAR COM CHAVE PUBLICA</button>
<button class="b" onclick="criar()">+ Criar Carteira</button>
<div id="okPub" class="small"></div>
</div>

<div class="card">
<label>Passo 2 - Criar PIN de 6 dígitos</label>
<input id="p1" type="password" maxlength="6" inputmode="numeric" placeholder="Criar PIN 6 dígitos">
<input id="p2" type="password" maxlength="6" inputmode="numeric" placeholder="Confirmar PIN 6 dígitos">
<button onclick="criarPin()">CRIAR PIN / SALVAR</button>
<div id="okPin" class="small"></div>
</div>

<div class="card">
<label>Chave Secreta S</label>
<input id="sBox" readonly value="••••••••••••">
<button class="b" onclick="copiarS()">Copiar Chave S</button>
<label><input type="checkbox" id="confS" onchange="esconder()" style="width:20px"> Confirmei que salvei a chave S, só depois esconder</label>
</div>

<div class="card">
<button onclick="ganhe()">🎁 GANHE 120 MCC</button>
<div id="okGanhe" class="small"></div>
<button class="b" onclick="location.href='https://stellar.expert/explorer/public/asset/MCCOIN-GB47'">Ver MCCOIN na Stellar</button>
</div>

<script>
let S="", PUB="", PIN="";
function entrar(){
  let v=document.getElementById('pub').value.trim();
  if(!v.startsWith('G')){alert('Cole uma PUB começando com G');return;}
  PUB=v; document.getElementById('okPub').innerHTML="✅ Entrou: "+v.slice(0,12)+"...";
}
function criar(){
  S='S'+Math.random().toString(36).slice(2,12).toUpperCase()+'XXXX';
  PUB='G'+Math.random().toString(36).slice(2,12).toUpperCase()+'XXXX';
  document.getElementById('pub').value=PUB;
  document.getElementById('sBox').value=S;
  alert('Carteira criada! Copie sua chave S agora.');
}
function criarPin(){
  let a=document.getElementById('p1').value, b=document.getElementById('p2').value;
  if(a.length!=6){alert('PIN tem que ter 6 números');return;}
  if(a!=b){alert('PINs diferentes');return;}
  PIN=a; document.getElementById('okPin').innerHTML="✅ PIN de 6 dígitos salvo!";
}
function copiarS(){ if(!S){alert('Crie a carteira primeiro');return;} navigator.clipboard.writeText(S); alert('Chave S copiada!'); }
function esconder(){ if(document.getElementById('confS').checked) document.getElementById('sBox').value="••••••••••••"; }
function ganhe(){
  if(!PUB){alert('Entre com PUB primeiro');return;}
  if(!PIN){alert('Crie o PIN de 6 dígitos primeiro');return;}
  document.getElementById('okGanhe').innerHTML="✅ Pedido de 120 MCC enviado! Confirme com seu PIN.";
}
</script>
</body>
</html>
